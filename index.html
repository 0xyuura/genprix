<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Chakra Petch for chrome (angular, reads like trackside signage), JetBrains
         Mono for anything that is a number on a timing screen, Inter for prose. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- The kart sprite is painted on the very first canvas frame; start it in
         parallel with the JS bundle instead of after it. type= means browsers
         without WebP skip this and let mascot.ts fall back to the PNG. -->
    <link rel="preload" as="image" href="/brand/mochi-kart.webp" type="image/webp" />
    <title>GenLayer Grand Prix</title>
    <script>
      // Pick the theme before the first paint. Doing this in React instead means
      // the page renders dark, then flips — a white flash on a projector at the
      // front of a room is worse than no light mode at all.
      (function () {
        try {
          var saved = localStorage.getItem("ggp_theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
